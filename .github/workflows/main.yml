name: Build Spotify with Eevee and spoti.pw

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: 'Direct HTTPS link to a clean decrypted Spotify IPA (or use SPOTIFY_IPA_URL secret)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      THEOS: ${{ github.workspace }}/theos
      CYAN_REF: '740d3716dcd98c20c000f12cdb88f1f0b2a533a4'

    steps:
      # No checkout of the hosting repository is needed: this file is standalone.
      - name: Initialize working directory
        run: echo "WORK=$RUNNER_TEMP/spotify-combined" >> "$GITHUB_ENV"

      - name: Select Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Find latest stable upstream releases
        id: releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, time, urllib.error, urllib.parse, urllib.request

          def api(path):
              request = urllib.request.Request('https://api.github.com/repos/' + path, headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'spotify-combined-workflow',
              })
              for attempt in range(3):
                  try:
                      with urllib.request.urlopen(request, timeout=60) as response:
                          return json.load(response)
                  except urllib.error.HTTPError as error:
                      if error.code >= 500 and attempt < 2:
                          time.sleep(2 ** attempt)
                          continue
                      raise SystemExit(f'GitHub API returned HTTP {error.code} for {path}. Retry later or check the upstream release.')
                  except (urllib.error.URLError, TimeoutError):
                      if attempt < 2:
                          time.sleep(2 ** attempt)
                          continue
                      raise SystemExit('Could not reach GitHub to resolve the latest releases.')

          def latest(repo):
              release = api(repo + '/releases/latest')
              if release.get('draft') or release.get('prerelease') or not release.get('tag_name'):
                  raise SystemExit(f'{repo}: expected a published stable release.')
              return release

          spoti_repo = 'skopevoj/spoti.pw'
          eevee_repo = 'SideloadLabs/EeveeSpotifyReincarnated'
          spoti = latest(spoti_repo)
          eevee = latest(eevee_repo)
          # Resolve the selected release tag to a commit so this run cannot drift.
          commit = api(spoti_repo + '/commits/' + urllib.parse.quote(spoti['tag_name'], safe=''))['sha']
          if not re.fullmatch(r'[0-9a-f]{40}', commit):
              raise SystemExit('GitHub returned an invalid spoti.pw commit.')
          assets = [a for a in eevee.get('assets', [])
                    if a.get('state') == 'uploaded'
                    and a.get('name', '').lower().endswith('.deb')
                    and not any(x in a['name'].lower() for x in ('roothide', 'arm64e', 'debug'))]
          arm64 = [a for a in assets if re.search(r'(?:^|[-_])arm64(?:[-_.]|$)', a['name'].lower())]
          candidates = arm64 or [a for a in assets if 'iphoneos-arm.' in a['name'].lower()]
          if len(candidates) != 1:
              raise SystemExit('Latest Eevee release must contain exactly one normal arm64 .deb. '
                               'No older release or roothide build will be silently substituted. '
                               'Available .deb assets: ' + ', '.join(a['name'] for a in assets))
          asset = candidates[0]
          url = asset['browser_download_url']
          if not url.startswith('https://github.com/' + eevee_repo + '/releases/download/'):
              raise SystemExit('Eevee asset URL does not belong to the expected upstream repository.')
          digest = asset.get('digest') or ''
          sha256 = digest.removeprefix('sha256:') if digest.startswith('sha256:') else ''
          if sha256 and not re.fullmatch(r'[0-9a-f]{64}', sha256):
              raise SystemExit('Invalid release asset SHA-256 digest.')
          if not sha256:
              print('::warning::GitHub did not provide an Eevee asset SHA-256; its downloaded checksum will still be recorded.')
          values = {'spoti_commit': commit, 'spoti_tag': spoti['tag_name'],
                    'eevee_tag': eevee['tag_name'], 'eevee_url': url,
                    'eevee_sha256': sha256, 'eevee_asset': asset['name']}
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              for key, value in values.items():
                  if any(c in value for c in '\r\n'):
                      raise SystemExit('Unexpected multiline GitHub release metadata.')
                  out.write(f'{key}={value}\n')
          print(f"Selected spoti.pw {spoti['tag_name']} ({commit})")
          print(f"Selected Eevee {eevee['tag_name']}: {asset['name']}")
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('### Automatically selected upstream releases\n\n')
              summary.write(f"- spoti.pw: **{spoti['tag_name']}**\n- Eevee: **{eevee['tag_name']}**\n\n")
              summary.write('Latest stable releases are selected afresh on every run. Their compatibility with your IPA still depends on upstream support.\n\n')
          PY

      - name: Check out spoti.pw
        uses: actions/checkout@v5
        with:
          repository: skopevoj/spoti.pw
          ref: ${{ steps.releases.outputs.spoti_commit }}
          path: spoti
          submodules: recursive
          persist-credentials: false

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Check out Theos
        uses: actions/checkout@v5
        with:
          repository: theos/theos
          path: theos
          submodules: recursive
          persist-credentials: false

      - name: Install build tools
        run: |
          set -euo pipefail
          brew install make dpkg ldid
          mkdir -p "$WORK" "$GITHUB_WORKSPACE/output"
          python3 -m venv "$WORK/venv"
          "$WORK/venv/bin/python" -m pip install --upgrade pip
          "$WORK/venv/bin/python" -m pip install "git+https://github.com/asdfzxcvbn/pyzule-rw.git@$CYAN_REF"
          echo "$WORK/venv/bin" >> "$GITHUB_PATH"
          xcodebuild -version
          SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"
          if (( ${SDK_VERSION%%.*} < 26 )); then
            echo '::error::spoti.pw requires an iPhoneOS 26+ SDK.'
            exit 1
          fi

      - name: Download and validate inputs
        env:
          IPA_URL_INPUT: ${{ inputs.ipa_url }}
          IPA_URL_SECRET: ${{ secrets.SPOTIFY_IPA_URL }}
          EEVEE_URL: ${{ steps.releases.outputs.eevee_url }}
          EEVEE_SHA256: ${{ steps.releases.outputs.eevee_sha256 }}
        run: |
          set -euo pipefail
          # Treat workflow inputs as data, never as shell source.
          python3 - <<'PY'
          import hashlib, os, pathlib, plistlib, re, shutil, subprocess, urllib.parse, zipfile

          work = pathlib.Path(os.environ['WORK'])
          def download(url, destination, label):
              url = url.strip()
              if not url or any(c in url for c in '\r\n'):
                  raise SystemExit(f'{label}: supply a single-line direct HTTPS URL.')
              parsed = urllib.parse.urlsplit(url)
              if parsed.scheme != 'https' or not parsed.hostname:
                  raise SystemExit(f'{label}: a direct HTTPS URL is required.')
              masked = url.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::add-mask::' + masked, flush=True)
              subprocess.run(['curl', '--fail', '--silent', '--show-error', '--location',
                              '--proto', '=https', '--proto-redir', '=https', '--retry', '3',
                              '--connect-timeout', '30', '--max-time', '1200',
                              '--output', str(destination), '--url', url], check=True)

          download(os.environ['IPA_URL_SECRET'].strip() or os.environ['IPA_URL_INPUT'],
                   work / 'original.ipa', 'Spotify IPA')
          download(os.environ['EEVEE_URL'], work / 'eevee.deb', 'Eevee package')
          deb = work / 'eevee.deb'
          with deb.open('rb') as f:
              if f.read(8) != b'!<arch>\n':
                  raise SystemExit('Eevee download is not a .deb archive; check the direct link.')
          with deb.open('rb') as f:
              digest = hashlib.file_digest(f, 'sha256').hexdigest()
          expected = os.environ['EEVEE_SHA256'].strip().lower()
          if expected and (not re.fullmatch('[0-9a-f]{64}', expected) or expected != digest):
              raise SystemExit('Eevee SHA-256 does not match the supplied checksum.')
          (work / 'eevee.sha256').write_text(digest)

          if not zipfile.is_zipfile(work / 'original.ipa'):
              raise SystemExit('IPA download is not a ZIP/IPA; the URL may point to a webpage.')
          with zipfile.ZipFile(work / 'original.ipa') as z:
              names = z.namelist()
              for name in names:
                  p = pathlib.PurePosixPath(name)
                  if p.is_absolute() or '..' in p.parts or '\\' in name:
                      raise SystemExit('IPA contains an unsafe archive path.')
              infos = [n for n in names if re.fullmatch(r'Payload/[^/]+\.app/Info\.plist', n)]
              if len(infos) != 1:
                  raise SystemExit('Expected exactly one Payload/*.app/Info.plist.')
              info = plistlib.loads(z.read(infos[0]))
              if info.get('CFBundleIdentifier') != 'com.spotify.client':
                  raise SystemExit('Use a clean Spotify IPA with bundle ID com.spotify.client.')
              duplicates = ('EeveeSpotify.dylib', 'spotifyglass.dylib', 'SpotifyGlassAppGroups.dylib')
              if any(pathlib.PurePosixPath(n).name in duplicates for n in names):
                  raise SystemExit('Input already contains one of these tweaks. Use a clean IPA.')
              app = infos[0].removesuffix('Info.plist')
              executable = info['CFBundleExecutable']
              if pathlib.PurePosixPath(executable).name != executable:
                  raise SystemExit('Invalid app executable name.')
              with z.open(app + executable) as source, (work / 'Spotify-check').open('wb') as target:
                  shutil.copyfileobj(source, target)
          binary = str(work / 'Spotify-check')
          architectures = subprocess.check_output(['lipo', '-archs', binary], text=True).split()
          if 'arm64' not in architectures:
              raise SystemExit('The Spotify executable must include arm64.')
          commands = subprocess.check_output(['otool', '-l', binary], text=True)
          if any(int(v) != 0 for v in re.findall(r'\bcryptid\s+(\d+)', commands)):
              raise SystemExit('Spotify executable is encrypted. Supply a decrypted IPA.')
          version = str(info.get('CFBundleShortVersionString', 'unknown'))
          print(f'Spotify version: {version}')
          print('Latest tweak releases were selected independently. Check the selected releases for support of this Spotify version.')
          (work / 'spotify-version.txt').write_text(version)
          PY
          dpkg-deb --info "$WORK/eevee.deb"
          dpkg-deb --extract "$WORK/eevee.deb" "$WORK/eevee"
          EEVEE_ARCH="$(dpkg-deb --field "$WORK/eevee.deb" Architecture)"
          case "$EEVEE_ARCH" in
            *roothide*|*arm64e*)
              echo '::error::Use the normal Eevee arm64 package, not the arm64e/roothide package.'
              exit 1 ;;
          esac

      - name: Build spoti.pw with Live Activity and widget support
        working-directory: spoti
        run: |
          set -euo pipefail
          # Run upstream's complete packaging pipeline. It builds the tweak,
          # Live Activity, App Group shim and merges the App Intents metadata.
          ./scripts/pipeline.sh "$WORK/original.ipa" --no-flex -o "$WORK/spoti-only.ipa"

      - name: Add Eevee to the same IPA
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          work = pathlib.Path(os.environ['WORK'])
          root = work / 'eevee'
          def unique(name, required=True):
              matches = list(root.rglob(name))
              if len(matches) > 1 or (required and not matches):
                  raise SystemExit(f'Expected one {name} in the Eevee .deb, found {len(matches)}.')
              return matches[0] if matches else None
          dylib = unique('EeveeSpotify.dylib')
          bundle = unique('EeveeSpotify.bundle')
          framework = unique('EeveeSwiftProtobuf.framework', required=False)
          if 'arm64' not in subprocess.check_output(['lipo', '-archs', str(dylib)], text=True).split():
              raise SystemExit('Eevee dylib does not contain arm64. Choose the normal arm64 .deb.')
          files = [dylib, bundle] + ([framework] if framework else [])
          (work / 'eevee-assets.json').write_text(json.dumps([p.name for p in files]))
          output = pathlib.Path(os.environ['GITHUB_WORKSPACE']) / 'output/Spotify-Eevee-spoti.pw.ipa'
          # No -e / -g: retain extensions. No -m: retain upstream's minimum OS.
          # cyan also supplies Orion/Substrate dependencies when Eevee needs them.
          subprocess.run(['cyan', '-i', str(work / 'spoti-only.ipa'), '-o', str(output),
                          '-f', *map(str, files), '-s', '-c', '6', '--overwrite'], check=True)
          PY

      - name: Verify combined IPA and record build details
        env:
          SPOTI_RELEASE: ${{ steps.releases.outputs.spoti_tag }}
          EEVEE_RELEASE: ${{ steps.releases.outputs.eevee_tag }}
          EEVEE_ASSET: ${{ steps.releases.outputs.eevee_asset }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, plistlib, re, shutil, subprocess, zipfile
          work = pathlib.Path(os.environ['WORK'])
          workspace = pathlib.Path(os.environ['GITHUB_WORKSPACE'])
          output = workspace / 'output/Spotify-Eevee-spoti.pw.ipa'
          def require(ok, message):
              if not ok:
                  raise SystemExit(message)
          def main_app(z):
              infos = [n for n in z.namelist() if re.fullmatch(r'Payload/[^/]+\.app/Info\.plist', n)]
              require(len(infos) == 1, 'Output does not contain exactly one app.')
              return infos[0].removesuffix('Info.plist'), plistlib.loads(z.read(infos[0]))
          with zipfile.ZipFile(work / 'spoti-only.ipa') as before, zipfile.ZipFile(output) as after:
              require(after.testzip() is None, 'Output IPA failed its ZIP integrity check.')
              old_app, old_info = main_app(before)
              app, info = main_app(after)
              names = set(after.namelist())
              require(info == old_info, 'Eevee injection unexpectedly changed the app Info.plist.')
              require(info.get('UIDesignRequiresCompatibility') is False, 'Liquid Glass flag is missing.')
              require(info.get('NSSupportsLiveActivities') is True, 'Live Activity flag is missing.')
              for dylib in ['spotifyglass.dylib', 'EeveeSpotify.dylib', 'SpotifyGlassAppGroups.dylib']:
                  require(app + 'Frameworks/' + dylib in names, f'Missing {dylib}.')
              require(any(n.startswith(app + 'EeveeSpotify.bundle/') for n in names), 'Missing Eevee resources.')
              extension = app + 'PlugIns/SpotifyGlassLiveActivity.appex/Info.plist'
              require(extension in names, 'Missing Live Activity extension.')
              for asset in json.loads((work / 'eevee-assets.json').read_text()):
                  if asset.endswith('.framework'):
                      require(app + 'Frameworks/' + asset + '/' + asset.removesuffix('.framework') in names,
                              f'Missing {asset}.')
              # App Intents metadata is byte-for-byte preserved across the second injection.
              for name in before.namelist():
                  if 'Metadata.appintents/' in name and not name.endswith('/'):
                      mapped = app + name[len(old_app):] if name.startswith(old_app) else name
                      require(mapped in names and before.read(name) == after.read(mapped),
                              f'App Intents metadata was lost or changed: {name}')
                  if name.startswith(old_app + 'PlugIns/') and name.endswith('.appex/Info.plist'):
                      require(app + name[len(old_app):] in names, f'Extension was removed: {name}')
              binary = work / 'combined-executable'
              with after.open(app + info['CFBundleExecutable']) as source, binary.open('wb') as target:
                  shutil.copyfileobj(source, target)
          links = subprocess.check_output(['otool', '-L', str(binary)], text=True)
          for name in ['spotifyglass.dylib', 'EeveeSpotify.dylib', 'SpotifyGlassAppGroups.dylib']:
              require('@rpath/' + name in links, f'Missing executable load command for {name}.')
          (workspace / 'output/load-commands.txt').write_text(links)
          def git_sha(path):
              return subprocess.check_output(['git', '-C', str(path), 'rev-parse', 'HEAD'], text=True).strip()
          with output.open('rb') as f:
              checksum = hashlib.file_digest(f, 'sha256').hexdigest()
          (workspace / 'output/SHA256SUMS.txt').write_text(checksum + '  ' + output.name + '\n')
          report = {
              'spotify_version': (work / 'spotify-version.txt').read_text(),
              'spoti_version': (workspace / 'spoti/version.txt').read_text().strip(),
              'spoti_release': os.environ['SPOTI_RELEASE'],
              'eevee_release': os.environ['EEVEE_RELEASE'],
              'eevee_asset': os.environ['EEVEE_ASSET'],
              'spoti_commit': git_sha(workspace / 'spoti'),
              'theos_commit': git_sha(workspace / 'theos'),
              'cyan_commit': os.environ['CYAN_REF'],
              'eevee_version': subprocess.check_output(['dpkg-deb', '--field', str(work / 'eevee.deb'), 'Version'], text=True).strip(),
              'eevee_deb_sha256': (work / 'eevee.sha256').read_text(),
              'ipa_sha256': checksum,
              'signing': 'Ad-hoc only; sign with your sideloading tool.',
              'validation': 'Packaging checks passed. Combined runtime compatibility requires device testing.'
          }
          (workspace / 'output/build-info.json').write_text(json.dumps(report, indent=2) + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('### Combined IPA ready\n\n')
              f.write('Download **Spotify-Eevee-spoti-pw** under this run\'s **Artifacts**.\n\n')
              f.write('Both tweak load commands, resources, Liquid Glass flags and the Live Activity extension were checked.\n\n')
              f.write('Sign the IPA before installing. A successful build does not establish runtime compatibility.\n')
          print('Combined IPA packaging checks passed.')
          PY

      - name: Upload combined IPA
        uses: actions/upload-artifact@v5
        with:
          name: Spotify-Eevee-spoti-pw
          path: output/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
